<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Salón Cometa · Demo LM Creaciones</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../demo.css">
  <style>
    :root { --bg: #f4f7ff; --card: #fff; --line: #dfe5f7; --ink: #1d2350; --muted: #6b7299; --blue: #3b5bfd; --pink: #ff5fa2; --yellow: #ffc83d; --green: #22b07d; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Inter", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
    .wrap { width: min(1000px, 100% - 32px); margin-inline: auto; }
    header { background: var(--blue); color: #fff; padding: 26px 0; position: relative; overflow: hidden; }
    header::before { content: "🎈 🎉 ⭐ 🎈 🎂 ⭐ 🎉"; position: absolute; right: -10px; top: 6px; font-size: 1.6rem; letter-spacing: 10px; opacity: .35; white-space: nowrap; }
    .logo { font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 2.4rem; line-height: 1; position: relative; }
    header p { margin: 6px 0 0; opacity: .9; position: relative; }
    .layout { display: grid; grid-template-columns: 1.1fr .9fr; gap: 18px; margin: 22px auto 40px; align-items: start; }
    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
    .box { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
    h2 { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 1.35rem; margin: 0 0 12px; }
    .mhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .mhead b { font-family: "Fredoka", sans-serif; font-size: 1.2rem; text-transform: capitalize; }
    .mhead button { border: 1px solid var(--line); background: #fff; border-radius: 10px; width: 36px; height: 36px; cursor: pointer; font-size: 1rem; }
    .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
    .cal .h { text-align: center; font-size: .75rem; font-weight: 700; color: var(--muted); padding: 4px 0; }
    .cal button { aspect-ratio: 1; border: 0; border-radius: 10px; font: 700 .9rem "Inter"; cursor: pointer; position: relative; background: #e9eeff; color: var(--ink); }
    .cal button.part { background: linear-gradient(135deg, #e9eeff 50%, #ffe1ee 50%); }
    .cal button.full { background: #ffe1ee; color: #c24b7f; cursor: default; }
    .cal button.on { background: var(--blue); color: #fff; }
    .cal button:disabled:not(.full) { background: transparent; color: #c3c8de; cursor: default; }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); margin-top: 10px; }
    .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 4px; vertical-align: -1px; }
    .turns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
    .turn { border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 10px 6px; font: 600 .85rem "Inter"; cursor: pointer; text-align: center; color: var(--ink); }
    .turn small { display: block; color: var(--muted); font-weight: 500; }
    .turn.on { border-color: var(--blue); background: #eef1ff; }
    .turn:disabled { opacity: .4; text-decoration: line-through; cursor: default; }
    .packs { display: grid; gap: 8px; }
    .pk { border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; cursor: pointer; background: #fff; text-align: left; font: inherit; color: inherit; }
    .pk.on { border-color: var(--pink); background: #fff2f8; }
    .pk b { font-family: "Fredoka", sans-serif; font-size: 1.1rem; }
    .pk small { display: block; color: var(--muted); margin-top: 2px; }
    .pk .pp { float: right; font-weight: 700; color: var(--pink); }
    label { display: block; font-size: .8rem; font-weight: 700; color: var(--muted); margin: 14px 0 6px; }
    input[type=range] { width: 100%; accent-color: var(--blue); }
    .extras { display: grid; gap: 6px; }
    .extras label { display: flex; justify-content: space-between; gap: 10px; margin: 0; font-weight: 500; color: var(--ink); font-size: .9rem; background: #f6f8ff; border-radius: 10px; padding: 9px 12px; cursor: pointer; }
    .sum { margin-top: 14px; border-top: 2px dashed var(--line); padding-top: 12px; }
    .sum div { display: flex; justify-content: space-between; padding: 3px 0; font-size: .93rem; }
    .sum .t { font-weight: 800; font-size: 1.15rem; }
    .cta { width: 100%; margin-top: 14px; padding: 14px; border: 0; border-radius: 14px; background: var(--pink); color: #fff; font: 700 1rem "Inter"; cursor: pointer; }
    .cta:disabled { opacity: .4; cursor: default; }
    .muted { color: var(--muted); font-size: .85rem; }
    .panel { position: fixed; inset: 0; z-index: 60; background: rgba(20,25,60,.5); display: grid; place-items: center; padding: 16px; }
    .panel[hidden] { display: none; }
    .pc { background: #fff; width: min(440px, 100%); border-radius: 18px; padding: 24px; text-align: center; }
  </style>
</head>
<body>
  <header><div class="wrap"><div class="logo">Salón Cometa</div><p>Cumples infantiles · Inflables · Animación · Cotillón</p></div></header>
  <main class="wrap layout">
    <div class="box">
      <h2>1. Elegí la fecha</h2>
      <div class="mhead"><button id="prev" aria-label="Mes anterior">‹</button><b id="month"></b><button id="next" aria-label="Mes siguiente">›</button></div>
      <div class="cal" id="cal"></div>
      <div class="legend"><span><i style="background:#e9eeff"></i>Libre</span><span><i style="background:linear-gradient(135deg,#e9eeff 50%,#ffe1ee 50%)"></i>Quedan turnos</span><span><i style="background:#ffe1ee"></i>Completo</span></div>
      <div class="turns" id="turns"></div>
    </div>
    <div class="box">
      <h2>2. Armá la fiesta</h2>
      <div class="packs" id="packs"></div>
      <label for="kids">Cantidad de chicos: <b id="kidsv">20</b></label>
      <input type="range" id="kids" min="10" max="50" step="5" value="20">
      <label>Extras</label>
      <div class="extras" id="extras"></div>
      <div class="sum" id="sum"></div>
      <button class="cta" id="go" disabled>Reservar con seña</button>
      <p class="muted">Seña del 30% para bloquear la fecha. El resto, hasta en 3 pagos antes de la fiesta.</p>
    </div>
  </main>
  <div class="panel" id="panel" hidden><div class="pc" id="pc"></div></div>

  <script src="../demo.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const PACKS = [
      { n: "Básico", d: "3 hs de salón, inflables, pancho y gaseosa", base: 180000, kid: 6000 },
      { n: "Completo", d: "+ animadora, piñata y torta", base: 260000, kid: 8000 },
      { n: "Premium", d: "+ show de magia, fotógrafo y souvenirs", base: 380000, kid: 10500 },
    ];
    const EXTRAS = [["Pintacaritas", 35000], ["Máquina de burbujas", 18000], ["Candy bar", 55000], ["Menú para adultos (x10)", 60000]];
    const TURNS = [["Mañana", "10 a 13 hs"], ["Tarde", "14 a 17 hs"], ["Noche", "18 a 21 hs"]];
    const st = { m: 0, date: null, turn: null, pack: 1, kids: 20, ex: new Set() };
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const taken = (d, t) => { const wk = d.getDay() === 0 || d.getDay() === 6; const n = ((d.getDate() * 31 + d.getMonth() * 7 + t * 13) * 9301 + 49297) % 233280 / 233280; return n < (wk ? 0.7 : 0.15); };
    const price = () => { const p = PACKS[st.pack]; return p.base + p.kid * Math.max(0, st.kids - 15) + [...st.ex].reduce((a, i) => a + EXTRAS[i][1], 0); };

    function render() {
      const first = new Date(today.getFullYear(), today.getMonth() + st.m, 1);
      $("month").textContent = first.toLocaleDateString("es-AR", { month: "long", year: "numeric" });
      $("prev").disabled = st.m === 0;
      const cells = []; const pad = (first.getDay() + 6) % 7;
      for (let i = 0; i < pad; i++) cells.push("<span></span>");
      const last = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
      for (let day = 1; day <= last; day++) {
        const d = new Date(first.getFullYear(), first.getMonth(), day);
        const past = d <= today, busyN = [0, 1, 2].filter((t) => taken(d, t)).length;
        const cls = past ? "" : busyN === 3 ? "full" : busyN ? "part" : "";
        const on = st.date && +st.date === +d;
        cells.push(`<button class="${cls} ${on ? "on" : ""}" data-d="${d.toISOString()}" ${past || busyN === 3 ? "disabled" : ""}>${day}</button>`);
      }
      $("cal").innerHTML = ["L", "M", "M", "J", "V", "S", "D"].map((h) => `<span class="h">${h}</span>`).join("") + cells.join("");
      $("turns").innerHTML = st.date ? TURNS.map(([n, h], t) => `<button class="turn ${st.turn === t ? "on" : ""}" data-t="${t}" ${taken(st.date, t) ? "disabled" : ""}>${n}<small>${h}</small></button>`).join("") : "";
      $("packs").innerHTML = PACKS.map((p, i) => `<button class="pk ${i === st.pack ? "on" : ""}" data-p="${i}"><span class="pp">desde ${pesos(p.base)}</span><b>${p.n}</b><small>${p.d}</small></button>`).join("");
      $("extras").innerHTML = EXTRAS.map(([n, p], i) => `<label><span><input type="checkbox" data-x="${i}" ${st.ex.has(i) ? "checked" : ""}> ${n}</span><b>${pesos(p)}</b></label>`).join("");
      $("kidsv").textContent = st.kids;
      const t = price();
      $("sum").innerHTML = `<div><span>${st.date ? st.date.toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" }) + (st.turn != null ? " · " + TURNS[st.turn][0] : "") : "Fecha sin elegir"}</span></div>
        <div><span>Pack ${PACKS[st.pack].n} · ${st.kids} chicos</span><span>${pesos(t)}</span></div>
        <div class="t"><span>Seña (30%)</span><span>${pesos(t * 0.3)}</span></div><div><span>Resto en 3 pagos de</span><span>${pesos((t * 0.7) / 3)}</span></div>`;
      $("go").disabled = !(st.date && st.turn != null);
    }
    document.body.addEventListener("click", (e) => {
      let el;
      if ((el = e.target.closest("[data-d]")) && !el.disabled) { st.date = new Date(el.dataset.d); st.turn = null; return render(); }
      if ((el = e.target.closest("[data-t]")) && !el.disabled) { st.turn = +el.dataset.t; return render(); }
      if ((el = e.target.closest("[data-p]"))) { st.pack = +el.dataset.p; return render(); }
    });
    $("extras").onchange = (e) => { const i = +e.target.dataset.x; e.target.checked ? st.ex.add(i) : st.ex.delete(i); render(); };
    $("kids").oninput = (e) => { st.kids = +e.target.value; render(); };
    $("prev").onclick = () => { st.m = Math.max(0, st.m - 1); render(); };
    $("next").onclick = () => { st.m = Math.min(5, st.m + 1); render(); };
    $("go").onclick = () => {
      $("pc").innerHTML = `<div style="font-size:3rem">🎉</div><h2>¡Fecha reservada!</h2><p>${st.date.toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" })} · turno ${TURNS[st.turn][0].toLowerCase()} (${TURNS[st.turn][1]})</p>
        <p class="muted">En el sistema real la seña se paga online y la fecha queda bloqueada al instante. El salón ve todas sus fiestas en un calendario, con lo que pagó cada familia y lo que falta, y el sistema avisa cuando vence una cuota.</p><button class="cta" id="close">Listo</button>`;
      $("panel").hidden = false;
    };
    $("panel").onclick = (e) => { if (e.target === $("panel") || e.target.closest("#close")) $("panel").hidden = true; };
    render();

    sheetViewer({
      title: "Packs y precios · Salón Cometa",
      note: "Los packs, el precio por chico extra (más de 15) y los adicionales se cambian desde la planilla. El total y la seña se calculan solos.",
      columns: ["Pack / extra", "Precio base", "Por chico extra", "Incluye"],
      rows: [...PACKS.map((p) => [p.n, p.base, p.kid, p.d]), ...EXTRAS.map(([n, p]) => [n, p, "", "Adicional"])],
    });
  </script>
</body>
</html>
