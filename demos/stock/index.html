<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock y caja · Demo LM Creaciones</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../demo.css">
  <style>
    :root { --bg: #f4f6f5; --card: #fff; --line: #e3e8e6; --ink: #13201c; --muted: #65736e; --teal: #0f9d8a; --teal-dark: #0b7b6c; --teal-soft: #e2f5f1; --red: #d64545; --red-soft: #fde8e8; --amber: #c27a0e; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Inter", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
    .app { display: grid; grid-template-columns: 220px 1fr; min-height: calc(100vh - 34px); }
    aside { background: var(--ink); color: #cfe0da; padding: 20px 14px; display: flex; flex-direction: column; gap: 6px; }
    .shop { color: #fff; font-weight: 800; font-size: 1.05rem; padding: 0 10px 16px; }
    .shop small { display: block; color: #8fb1a6; font-weight: 500; font-size: .78rem; }
    .nav { border: 0; background: none; color: inherit; text-align: left; padding: 11px 12px; border-radius: 10px; font: 600 .95rem "Inter", sans-serif; cursor: pointer; display: flex; gap: 10px; align-items: center; }
    .nav.on { background: #1f3a33; color: #fff; }
    .nav .n { margin-left: auto; background: var(--red); color: #fff; border-radius: 999px; font-size: .72rem; padding: 1px 7px; }
    .rubro { display: block; color: #8fb1a6; font-size: .75rem; padding: 0 10px 14px; }
    .rubro select { display: block; width: 100%; margin-top: 4px; padding: 8px; border-radius: 9px; border: 1px solid #2c4a42; background: #1f3a33; color: #fff; font: 600 .85rem "Inter", sans-serif; }
    .code { font-size: .72rem; color: var(--muted); font-family: ui-monospace, monospace; }
    .reset { margin-top: auto; border: 1px solid #2c4a42; background: none; color: #8fb1a6; border-radius: 10px; padding: 9px; font: 500 .8rem "Inter", sans-serif; cursor: pointer; }
    main { padding: 22px; min-width: 0; }
    h1 { margin: 0 0 4px; font-size: 1.5rem; }
    .sub { color: var(--muted); margin: 0 0 18px; font-size: .92rem; }
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
    .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
    .kpi small { color: var(--muted); font-size: .8rem; }
    .kpi b { display: block; font-size: 1.35rem; margin-top: 4px; }
    .kpi.alert b { color: var(--red); }
    .box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
    .pos { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; align-items: start; }
    input, select { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; background: #fff; width: 100%; }
    .prods { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
    .p { border: 1px solid var(--line); background: #fbfcfc; border-radius: 12px; padding: 12px; text-align: left; cursor: pointer; font: inherit; color: inherit; }
    .p:hover { border-color: var(--teal); }
    .p b { display: block; font-size: .9rem; }
    .p span { font-size: .82rem; color: var(--muted); }
    .p .code { display: block; font-size: .7rem; margin-bottom: 2px; }
    .p .pr { color: var(--ink); font-weight: 700; font-size: .92rem; }
    .p:disabled { opacity: .45; cursor: default; }
    .ticket h3 { margin: 0 0 10px; font-size: 1rem; }
    .tl { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: .9rem; }
    .tl .nm { flex: 1; }
    .tl button { border: 1px solid var(--line); background: #fff; width: 26px; height: 26px; border-radius: 8px; cursor: pointer; }
    .tt { display: flex; justify-content: space-between; font-size: 1.3rem; font-weight: 800; margin: 14px 0; }
    .pays { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
    .pays button { padding: 9px; border: 1px solid var(--line); background: #fff; border-radius: 10px; font: 600 .85rem "Inter", sans-serif; cursor: pointer; }
    .pays button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
    .cta { width: 100%; padding: 14px; border: 0; border-radius: 12px; background: var(--teal); color: #fff; font: 700 1rem "Inter", sans-serif; cursor: pointer; }
    .cta:disabled { opacity: .4; cursor: default; }
    .cta.small { width: auto; padding: 10px 16px; font-size: .9rem; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th { text-align: left; color: var(--muted); font-weight: 600; font-size: .8rem; padding: 8px; border-bottom: 1px solid var(--line); }
    td { padding: 10px 8px; border-bottom: 1px solid var(--line); }
    .tbl { overflow-x: auto; }
    .pill { font-size: .75rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
    .pill.ok { background: var(--teal-soft); color: var(--teal-dark); }
    .pill.low { background: #fff1db; color: var(--amber); }
    .pill.out { background: var(--red-soft); color: var(--red); }
    .adj { display: flex; gap: 6px; }
    .adj button { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 5px 9px; cursor: pointer; font: 600 .8rem "Inter", sans-serif; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .split { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: .93rem; }
    .split.big { font-weight: 800; font-size: 1.1rem; border: 0; }
    .form { display: flex; gap: 8px; margin-top: 10px; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; font-weight: 600; z-index: 70; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.show { opacity: 1; }
    .sheet-fab { display: none; }
    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      aside { flex-direction: row; overflow-x: auto; padding: 8px; gap: 4px; position: sticky; top: 34px; z-index: 20; }
      .shop, .reset { display: none; }
      .rubro { flex: none; padding: 0; font-size: 0; }
      .rubro select { margin: 0; width: auto; font-size: .82rem; }
      .nav { flex: none; padding: 9px 12px; font-size: .88rem; }
      main { padding: 16px; }
      .kpis { grid-template-columns: 1fr 1fr; }
      .pos, .row2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="shop" id="shop"></div>
      <label class="rubro">Probá otro rubro<select id="rubro"></select></label>
      <button class="nav on" data-view="vender">🧾 Vender</button>
      <button class="nav" data-view="stock">📦 Stock <span class="n" id="lowcount" hidden></span></button>
      <button class="nav" data-view="caja">💰 Caja del día</button>
      <button class="nav" data-view="ventas">📈 Ventas</button>
      <button class="reset" id="reset">↺ Reiniciar demo</button>
    </aside>
    <main id="main"></main>
  </div>
  <div class="toast" id="toast"></div>

  <script src="../demo.js"></script>
  <script>
    // Cada rubro: el negocio, sus productos ([código, nombre, categoría, costo, precio, stock, mínimo]) y un gasto del día.
    const RUBROS = {
      almacen: { name: "🍀 Almacén El Trébol", user: "Marta (dueña)", label: "Almacén", search: "Buscar producto…", expense: "Pago a proveedor de lácteos", products: [
        ["7790387", "Yerba Playadito 1 kg", "Almacén", 5200, 7400, 14, 6], ["7792540", "Azúcar Ledesma 1 kg", "Almacén", 1100, 1650, 22, 10],
        ["7790070", "Fideos Matarazzo 500 g", "Almacén", 1300, 1950, 3, 8], ["7790580", "Arroz Gallo 1 kg", "Almacén", 1800, 2600, 11, 6],
        ["7790060", "Aceite Natura 1,5 L", "Almacén", 3900, 5600, 2, 5], ["7790742", "Leche La Serenísima 1 L", "Lácteos", 1150, 1600, 18, 12],
        ["7791337", "Yogur bebible 1 L", "Lácteos", 1700, 2450, 7, 6], ["2000123", "Queso cremoso x kg", "Lácteos", 7800, 11200, 4, 3],
        ["7790895", "Coca-Cola 2,25 L", "Bebidas", 3100, 4500, 16, 8], ["7798062", "Agua Villavicencio 2 L", "Bebidas", 1000, 1500, 0, 6],
        ["7792798", "Cerveza Quilmes 1 L", "Bebidas", 2300, 3300, 24, 12], ["7790040", "Pan lactal Fargo", "Panificados", 2600, 3700, 5, 4],
        ["7622300", "Galletitas Oreo", "Golosinas", 1200, 1800, 30, 10], ["7790580", "Alfajor Guaymallén", "Golosinas", 300, 500, 48, 20],
        ["7791290", "Detergente Magistral", "Limpieza", 2400, 3500, 9, 4], ["7790520", "Lavandina Ayudín 1 L", "Limpieza", 900, 1350, 1, 4] ] },
      repuestos: { name: "🏍️ Repuestos Ruta Oeste", user: "Hernán (dueño)", label: "Casa de repuestos", search: "Buscar por código, nombre o modelo…", expense: "Flete de mercadería", products: [
        ["FA-1123", "Filtro de aceite (Gol / Fox / Suran)", "Filtros", 6200, 9800, 12, 5], ["FAI-208", "Filtro de aire Peugeot 208", "Filtros", 8900, 13900, 3, 4],
        ["PF-0457", "Pastillas de freno del. Corsa / Onix", "Frenos", 18500, 28900, 6, 4], ["DF-0219", "Disco de freno ventilado (par)", "Frenos", 42000, 64000, 2, 2],
        ["BJ-NGK7", "Bujía NGK BKR6E (x4)", "Encendido", 14800, 22500, 9, 4], ["CD-1415", "Kit distribución Fiat 1.4", "Motor", 61000, 94000, 1, 2],
        ["AC-5W30", "Aceite sintético 5W30 4 L", "Lubricantes", 31000, 46500, 15, 6], ["AC-2050", "Aceite moto 20W50 1 L", "Lubricantes", 5600, 8900, 22, 10],
        ["LP-H4", "Lámpara H4 60/55W", "Iluminación", 3200, 5400, 18, 8], ["BAT-65", "Batería 12x65 Ah", "Eléctrico", 98000, 145000, 4, 2],
        ["CAD-428", "Kit transmisión moto 110 cc", "Motos", 26000, 39500, 5, 3], ["CUB-275", "Cubierta moto 2.75-18", "Motos", 34000, 51000, 0, 2],
        ["LIQ-REF", "Líquido refrigerante 1 L", "Lubricantes", 3900, 6200, 11, 6], ["ESC-TR", "Escobillas limpiaparabrisas (par)", "Accesorios", 7400, 11900, 7, 4] ] },
      libreria: { name: "📚 Librería Papelito", user: "Claudia (dueña)", label: "Librería", search: "Buscar artículo…", expense: "Compra de resmas al mayorista", products: [
        ["CU-RIV48", "Cuaderno Rivadavia ABC 48 h", "Escolar", 2900, 4600, 35, 15], ["CU-UNI80", "Cuaderno universitario 80 h", "Escolar", 4100, 6500, 18, 10],
        ["CA-ESC", "Carpeta Nº3 con anillos", "Escolar", 5200, 8200, 9, 6], ["RE-A4", "Resma A4 75 g (500 h)", "Oficina", 6800, 9900, 6, 8],
        ["BI-BIC", "Birome Bic azul (x10)", "Escritura", 3800, 5900, 14, 6], ["LA-FAB12", "Lápices de colores Faber x12", "Arte", 4300, 6900, 11, 5],
        ["MA-FIB", "Marcadores de fibra x10", "Arte", 3600, 5800, 2, 5], ["GO-LIQ", "Plasticola 90 g", "Escolar", 1500, 2400, 25, 10],
        ["TI-ESC", "Tijera escolar punta roma", "Escolar", 1900, 3100, 0, 5], ["CA-MAN", "Cartuchera de 2 pisos", "Escolar", 9800, 15500, 4, 3],
        ["MO-ESC", "Mochila escolar con carro", "Mochilas", 38000, 59000, 3, 2], ["SO-A4", "Sobres de papel A4 (x10)", "Oficina", 2100, 3400, 20, 8],
        ["FO-COP", "Fotocopia simple faz", "Servicios", 30, 120, 999, 0], ["AN-ESP", "Anillado hasta 100 hojas", "Servicios", 400, 1500, 999, 0] ] },
      ferreteria: { name: "🔩 Ferretería El Tornillo", user: "Jorge (dueño)", label: "Ferretería", search: "Buscar artículo o medida…", expense: "Pago al corralón", products: [
        ["TOR-6x40", "Tornillo autorroscante 6x40 (x100)", "Bulonería", 3200, 5100, 14, 6], ["TAR-8", "Tarugo Fischer 8 mm (x50)", "Bulonería", 2600, 4200, 21, 8],
        ["CL-2P", "Clavos punta paris 2\" (1 kg)", "Bulonería", 3900, 6100, 7, 5], ["CIN-AIS", "Cinta aisladora 3M", "Electricidad", 1300, 2200, 30, 12],
        ["CAB-2.5", "Cable unipolar 2,5 mm (x metro)", "Electricidad", 650, 1100, 180, 100], ["LAM-LED", "Lámpara LED 12W luz fría", "Electricidad", 1700, 2900, 3, 10],
        ["LLA-ESF", "Llave esférica 1/2\"", "Plomería", 5400, 8600, 6, 4], ["TEF-ROL", "Cinta de teflón", "Plomería", 450, 900, 40, 15],
        ["PIN-LAT", "Pintura látex interior 4 L", "Pinturería", 18500, 28900, 5, 3], ["RODI-22", "Rodillo antigota 22 cm", "Pinturería", 4200, 6900, 2, 4],
        ["SIL-TR", "Sellador siliconado transparente", "Pinturería", 3600, 5700, 9, 5], ["MEC-10", "Mecha para hormigón 10 mm", "Herramientas", 2800, 4600, 0, 3],
        ["CAN-CR", "Candado de bronce 40 mm", "Seguridad", 7900, 12500, 4, 2], ["CIN-MET", "Cinta métrica 5 m", "Herramientas", 4300, 6900, 8, 3] ] },
    };
    const RKEY = "lm-demo-stock-rubro";
    const pickRubro = () => { const q = new URLSearchParams(location.search).get("rubro"); if (RUBROS[q]) return q; try { const r = localStorage.getItem(RKEY); if (RUBROS[r]) return r; } catch {} return "almacen"; };
    const RUBRO = pickRubro(), R = RUBROS[RUBRO];
    const SEED = {
      products: R.products.map(([code, name, cat, cost, price, stock, min], id) => ({ id, code, name, cat, cost, price, stock, min })),
      sales: [],
      expenses: [{ t: "08:30", desc: R.expense, amount: 12000 }],
      opening: 20000,
    };
    const KEY = "lm-demo-stock-v2-" + RUBRO;
    const load = () => { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.products) return s; } catch {} return structuredClone(SEED); };
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };
    let S = load();
    // Si es la primera vez, se cargan unas ventas de la mañana para que la caja no arranque vacía.
    if (!S.sales.length && !S._seeded) {
      [[[12, 2], [8, 1], "Efectivo", "09:12"], [[0, 1], [1, 2], "Transferencia", "09:47"], [[5, 3], [11, 1], "Débito", "10:20"], [[10, 1], [13, 2], "Mercado Pago", "11:05"]]
        .forEach((x) => { const pay = x[x.length - 2], t = x[x.length - 1]; const items = x.slice(0, -2).map(([id, q]) => ({ id, q, price: S.products[id].price })); S.sales.push({ t, pay, items, total: items.reduce((a, i) => a + i.q * i.price, 0) }); });
      S._seeded = true; save();
    }
    document.title = R.name.slice(R.name.indexOf(" ") + 1) + " · Stock y caja · Demo LM Creaciones";

    const $ = (id) => document.getElementById(id);
    const PAYS = ["Efectivo", "Transferencia", "Débito", "Mercado Pago"];
    const state = (p) => (p.stock === 0 ? "out" : p.stock <= p.min ? "low" : "ok");
    const now = () => new Date().toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
    let view = "vender", ticket = new Map(), pay = "Efectivo", search = "";

    function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200); }
    const salesTotal = () => S.sales.reduce((a, s) => a + s.total, 0);
    const profit = () => S.sales.reduce((a, s) => a + s.items.reduce((b, i) => b + i.q * (i.price - S.products[i.id].cost), 0), 0);
    const lows = () => S.products.filter((p) => state(p) !== "ok");

    function kpis() {
      return `<div class="kpis">
        <div class="kpi"><small>Vendido hoy</small><b>${pesos(salesTotal())}</b></div>
        <div class="kpi"><small>Ganancia estimada</small><b>${pesos(profit())}</b></div>
        <div class="kpi"><small>Tickets</small><b>${S.sales.length}</b></div>
        <div class="kpi ${lows().length ? "alert" : ""}"><small>Reponer</small><b>${lows().length} productos</b></div>
      </div>`;
    }

    const views = {
      vender() {
        const list = S.products.filter((p) => (p.name + " " + p.code).toLowerCase().includes(search));
        const sum = [...ticket].reduce((a, [id, q]) => a + q * S.products[id].price, 0);
        return `<h1>Vender</h1><p class="sub">Tocá los productos para armar el ticket. El stock se descuenta solo al cobrar.</p>${kpis()}
        <div class="pos">
          <div class="box"><input id="search" placeholder="🔎 ${R.search}" value="${search}">
            <div class="prods">${list.map((p) => `<button class="p" data-add="${p.id}" ${p.stock ? "" : "disabled"}><span class="code">${p.code}</span><b>${p.name}</b><span class="pr">${pesos(p.price)}</span><br><span>${p.stock >= 999 ? "Servicio" : p.stock ? `Quedan ${p.stock}` : "Sin stock"}</span></button>`).join("")}</div>
          </div>
          <div class="box ticket"><h3>Ticket actual</h3>
            ${[...ticket].map(([id, q]) => `<div class="tl"><span class="nm">${S.products[id].name}</span><button data-q="${id}" data-d="-1">−</button><b>${q}</b><button data-q="${id}" data-d="1">+</button><span>${pesos(q * S.products[id].price)}</span></div>`).join("") || '<p class="sub">Todavía no agregaste productos.</p>'}
            <div class="tt"><span>Total</span><span>${pesos(sum)}</span></div>
            <div class="pays">${PAYS.map((x) => `<button data-pay="${x}" class="${x === pay ? "on" : ""}">${x}</button>`).join("")}</div>
            <button class="cta" id="charge" ${ticket.size ? "" : "disabled"}>Cobrar ${pesos(sum)}</button>
          </div>
        </div>`;
      },
      stock() {
        return `<h1>Stock</h1><p class="sub">Precios, costos y existencias. Las alertas aparecen cuando un producto baja de su mínimo.</p>${kpis()}
        <div class="box tbl"><table><thead><tr><th>Código</th><th>Producto</th><th>Categoría</th><th>Costo</th><th>Precio</th><th>Margen</th><th>Stock</th><th>Estado</th><th>Ajustar</th></tr></thead><tbody>
        ${S.products.map((p) => `<tr><td class="code">${p.code}</td><td><b>${p.name}</b></td><td>${p.cat}</td><td>${pesos(p.cost)}</td><td>${pesos(p.price)}</td><td>${Math.round((p.price / p.cost - 1) * 100)}%</td><td>${p.stock >= 999 ? "—" : `<b>${p.stock}</b> <small style="color:var(--muted)">/ mín ${p.min}</small>`}</td>
          <td><span class="pill ${state(p)}">${{ ok: "OK", low: "Reponer", out: "Sin stock" }[state(p)]}</span></td>
          <td><div class="adj"><button data-st="${p.id}" data-d="-1">−1</button><button data-st="${p.id}" data-d="1">+1</button><button data-st="${p.id}" data-d="12">+12</button></div></td></tr>`).join("")}
        </tbody></table></div>`;
      },
      caja() {
        const by = Object.fromEntries(PAYS.map((p) => [p, 0])); S.sales.forEach((s) => (by[s.pay] += s.total));
        const exp = S.expenses.reduce((a, e) => a + e.amount, 0);
        return `<h1>Caja del día</h1><p class="sub">Cuánto entró por cada medio de pago y cuánta plata tiene que haber en el cajón.</p>${kpis()}
        <div class="row2">
          <div class="box"><h3 style="margin-top:0">Ingresos por medio de pago</h3>
            ${PAYS.map((p) => `<div class="split"><span>${p}</span><b>${pesos(by[p])}</b></div>`).join("")}
            <div class="split big"><span>Total vendido</span><span>${pesos(salesTotal())}</span></div>
          </div>
          <div class="box"><h3 style="margin-top:0">Efectivo en el cajón</h3>
            <div class="split"><span>Apertura</span><b>${pesos(S.opening)}</b></div>
            <div class="split"><span>+ Ventas en efectivo</span><b>${pesos(by.Efectivo)}</b></div>
            <div class="split"><span>− Gastos pagados</span><b>${pesos(exp)}</b></div>
            <div class="split big"><span>Debería haber</span><span>${pesos(S.opening + by.Efectivo - exp)}</span></div>
            <h3>Gastos</h3>
            ${S.expenses.map((e) => `<div class="split"><span>${e.t} · ${e.desc}</span><b>${pesos(e.amount)}</b></div>`).join("")}
            <div class="form"><input id="expdesc" placeholder="Ej.: flete"><input id="expamt" type="number" placeholder="$" style="max-width:110px"><button class="cta small" id="addexp">Agregar</button></div>
          </div>
        </div>`;
      },
      ventas() {
        const units = {}; S.sales.forEach((s) => s.items.forEach((i) => (units[i.id] = (units[i.id] || 0) + i.q)));
        const top = Object.entries(units).sort((a, b) => b[1] - a[1]).slice(0, 5);
        return `<h1>Ventas</h1><p class="sub">Cada ticket del día y lo más vendido.</p>${kpis()}
        <div class="row2">
          <div class="box tbl"><table><thead><tr><th>Hora</th><th>Detalle</th><th>Pago</th><th>Total</th></tr></thead><tbody>
          ${[...S.sales].reverse().map((s) => `<tr><td>${s.t}</td><td>${s.items.map((i) => `${i.q}× ${S.products[i.id].name}`).join(", ")}</td><td>${s.pay}</td><td><b>${pesos(s.total)}</b></td></tr>`).join("")}
          </tbody></table></div>
          <div class="box"><h3 style="margin-top:0">Más vendidos hoy</h3>
          ${top.map(([id, q], k) => `<div class="split"><span>${k + 1}. ${S.products[id].name}</span><b>${q} u.</b></div>`).join("") || '<p class="sub">Sin ventas todavía.</p>'}</div>
        </div>`;
      },
    };

    function render() {
      $("main").innerHTML = views[view]();
      document.querySelectorAll(".nav").forEach((b) => b.classList.toggle("on", b.dataset.view === view));
      const n = lows().length; $("lowcount").hidden = !n; $("lowcount").textContent = n;
      const s = $("search"); if (s) { s.oninput = (e) => { search = e.target.value.toLowerCase(); const pos = e.target.selectionStart; render(); const ns = $("search"); ns.focus(); ns.setSelectionRange(pos, pos); }; }
    }

    document.querySelector("aside").onclick = (e) => { const b = e.target.closest(".nav"); if (b) { view = b.dataset.view; render(); } };
    $("main").onclick = (e) => {
      const add = e.target.closest("[data-add]");
      if (add && !add.disabled) { const id = +add.dataset.add; if ((ticket.get(id) || 0) < S.products[id].stock) ticket.set(id, (ticket.get(id) || 0) + 1); else toast("No hay más stock de ese producto"); return render(); }
      const q = e.target.closest("[data-q]");
      if (q) { const id = +q.dataset.q, n = ticket.get(id) + +q.dataset.d; if (n <= 0) ticket.delete(id); else if (n <= S.products[id].stock) ticket.set(id, n); return render(); }
      const p = e.target.closest("[data-pay]"); if (p) { pay = p.dataset.pay; return render(); }
      if (e.target.closest("#charge")) {
        const items = [...ticket].map(([id, q]) => ({ id, q, price: S.products[id].price }));
        items.forEach((i) => (S.products[i.id].stock -= i.q));
        const total = items.reduce((a, i) => a + i.q * i.price, 0);
        S.sales.push({ t: now(), pay, items, total }); ticket = new Map(); save();
        const low = items.map((i) => S.products[i.id]).filter((p) => state(p) !== "ok");
        toast(`✅ Venta registrada: ${pesos(total)}` + (low.length ? ` · ⚠️ Reponer ${low[0].name}` : ""));
        return render();
      }
      const st = e.target.closest("[data-st]");
      if (st) { const pr = S.products[+st.dataset.st]; pr.stock = Math.max(0, pr.stock + +st.dataset.d); save(); return render(); }
      if (e.target.closest("#addexp")) {
        const desc = $("expdesc").value.trim(), amount = +$("expamt").value;
        if (!desc || !(amount > 0)) return toast("Completá el gasto y el monto");
        S.expenses.push({ t: now(), desc, amount }); save(); toast("Gasto agregado"); return render();
      }
    };
    $("reset").onclick = () => { try { localStorage.removeItem(KEY); } catch {} S = load(); S._seeded = false; location.reload(); };

    $("shop").innerHTML = `${R.name}<small>Usuario: ${R.user}</small>`;
    $("rubro").innerHTML = Object.entries(RUBROS).map(([k, r]) => `<option value="${k}" ${k === RUBRO ? "selected" : ""}>${r.label}</option>`).join("");
    $("rubro").onchange = (e) => { try { localStorage.setItem(RKEY, e.target.value); } catch {} location.search = "?rubro=" + e.target.value; };
    render();
  </script>
</body>
</html>
